<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#06080b}
.ring{fill:none;stroke:#8fd1c0;transform-origin:340px 200px}
.r1{stroke-width:1;stroke-dasharray:2 7;animation:spin 60s linear infinite}
.r2{stroke-width:1;stroke-dasharray:18 8;opacity:.8;animation:spin 40s linear infinite reverse}
.r3{stroke-width:1;opacity:.5}
.r4{stroke-width:1;stroke-dasharray:4 4;opacity:.7;animation:spin 25s linear infinite}
.core{fill:#8fd1c0;animation:pulse 4s ease-in-out infinite}
.wire{stroke:#2a3a3a;stroke-width:1;fill:none}
.dot{fill:#8fd1c0;animation:drift 9s linear infinite}
.d2{animation-duration:13s;animation-delay:-4s}
.d3{animation-duration:11s;animation-delay:-7s}
.gl{font-family:"Courier New",monospace;font-size:12px;fill:#6b8580;animation:rise 14s linear infinite}
.g2{animation-duration:19s;animation-delay:-6s}
.g3{animation-duration:16s;animation-delay:-11s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes drift{from{transform:translateY(-20px);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateY(420px);opacity:0}}
@keyframes rise{from{transform:translateY(420px);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateY(-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" width="680" height="400"/>
<path class="wire" d="M90 0V400M210 0V400M470 0V400M590 0V400M0 330H680"/>
<circle class="dot" cx="90" cy="0" r="2.5"/>
<circle class="dot d2" cx="470" cy="0" r="2.5"/>
<circle class="dot d3" cx="590" cy="0" r="2.5"/>
<text class="gl" x="40" y="0">0x4F</text>
<text class="gl g2" x="140" y="0">ｗｉｒｅｄ</text>
<text class="gl g3" x="520" y="0">01101</text>
<text class="gl" x="620" y="0">いと</text>
<circle class="ring r1" cx="340" cy="200" r="165"/>
<circle class="ring r2" cx="340" cy="200" r="130"/>
<circle class="ring r3" cx="340" cy="200" r="96"/>
<circle class="ring r4" cx="340" cy="200" r="62"/>
<path d="M340 30V370M170 200H510" stroke="#2a3a3a" stroke-width="1"/>
<circle class="core" cx="340" cy="200" r="8"/>
</svg>
